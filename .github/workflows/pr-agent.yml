# Comment-only PR-Agent (The-PR-Agent OSS). Not a merge gate.
# Auto /review on opened, synchronize, ready_for_review. Slash /review and /ask
# stay for repo writers. No checkout. No pull_request_target.
# Pin is the 0.47.0-github_action image index digest from Docker Hub (2026-10-02).
# the-pr-agent/pr-agent action.yaml FROM is the floating :github_action tag, so the
# image digest is the real pin. OPENAI.API_BASE is host-only; ignored in .pr_agent.toml.

name: PR-Agent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    if: >
      github.event.sender.type != 'Bot'
      && (
        (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && (
            startsWith(github.event.comment.body, '/review')
            || startsWith(github.event.comment.body, '/ask')
          )
          && (
            github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
        )
        || (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (
            github.event.action == 'ready_for_review'
            || (github.event.action == 'labeled' && github.event.label.name == 'pr-agent')
            || (
              github.event.pull_request.draft == false
              && (
                github.event.action == 'opened'
                || github.event.action == 'synchronize'
              )
            )
          )
        )
      )
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Comment-only review
    steps:
      - name: Skip fork pull requests
        id: fork
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            same=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}" --jq '.head.repo.full_name == .base.repo.full_name')
          else
            same=true
          fi
          echo "same_repo=${same}" >> "${GITHUB_OUTPUT}"

      - name: PR Agent
        if: steps.fork.outputs.same_repo == 'true'
        id: pragent
        uses: docker://pragent/pr-agent@sha256:31b9aac6ab067bada9a0c1b001d30ebc500ea4487e00a93c18c59b9ef5fa66db # 0.47.0-github_action
        env:
          OPENAI_KEY: ${{ secrets.DO_INFERENCE_API_KEY }}
          OPENAI.API_BASE: https://inference.do-ai.run/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          github_action_config.fail_on_tool_errors: "false"
          github_action_config.pr_actions: '["opened", "ready_for_review", "labeled"]'
          config.restricted_mode: "true"
          config.enable_auto_approval: "false"
          config.enable_per_directory_settings: "false"
          config.publish_output_progress: "false"
          config.model: "deepseek-v4.1-flash"
          config.fallback_models: '["llama-4-maverick", "glm-5.3-flash"]'
          config.custom_model_max_tokens: "128000"
          github.publish_as_check_run: "false"
          github.ignore_bot_pr: "true"
          pr_reviewer.inline_key_issues: "false"
          pr_reviewer.enable_review_labels_security: "false"
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.require_merge_recommendation: "false"
          pr_code_suggestions.committable_code_suggestions: "false"
          pr_code_suggestions.approve_pr_on_self_review: "false"
          pr_update_changelog.push_changelog_changes: "false"
          litellm.custom_llm_provider: "openai"
          litellm.drop_params: "true"
          pr_reviewer.extra_instructions: "Flag Secret data in CI comments, empty or floating image tags, and HTTPRoute hostname conflicts. Do not repeat secret values. Comment only; do not approve or request changes."
