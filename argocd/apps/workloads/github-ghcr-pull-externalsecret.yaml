# PAT used by the dieu-dev PR ApplicationSet to list private jonathandieu/dieu.dev
# PRs. Same 1Password item as the dieu-dev GHCR pull secret (github.ghcr-pull /
# credential). Not a second GitHub App. Field must be able to list PRs on that
# private repo (classic `repo`, or fine-grained Pull requests: Read).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-ghcr-pull
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: github-ghcr-pull
  data:
    - secretKey: credential
      remoteRef:
        key: github.ghcr-pull/credential
