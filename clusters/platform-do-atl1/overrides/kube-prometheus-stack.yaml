# Self-hosted Grafana on platform only; stage stays on Grafana Cloud (base values).
kube-prometheus-stack:
  grafana:
    enabled: true
    # The chart auto-provisions its own default Prometheus datasource
    # ConfigMap (kube-prometheus-stack-grafana-datasource) separately from
    # whatever's in grafana.datasources below. With both marked isDefault, the
    # sidecar loads two "default" datasources and Grafana refuses to start:
    # "Only one datasource per organization can be marked as default". Disable
    # the chart's own one since our datasources block below already covers
    # Prometheus (and Loki, which the chart doesn't know about at all).
    sidecar:
      datasources:
        defaultDatasourceEnabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://kube-prometheus-stack-prometheus:9090
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki-gateway.monitoring.svc.cluster.local
            access: proxy
