# Self-hosted Grafana on platform only. Prometheus sidecar is the local
# scrape TSDB (isDefault); this file adds Loki + Mimir. Mimir is the 14d
# Spaces store and the datasource for cluster/service dashboards.
#
# grafana.dieu.dev HTTPRoute is platform-only. Grafana keeps its own login
# (anonymous stays off); Cloudflare Access sits in front of the hostname.
# Admin password comes from 1Password grafana.admin (not Helm lookup).
# PVC keeps SQLite so service accounts survive pod restarts.
grafanaHttpRoute:
  enabled: true

grafanaAdmin:
  enabled: true

kube-prometheus-stack:
  grafana:
    enabled: true
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      size: 10Gi
      # storageClassName omitted: cluster default (DOKS do-block-storage).
    grafana.ini:
      auth.anonymous:
        enabled: false
      server:
        domain: grafana.dieu.dev
        root_url: https://grafana.dieu.dev
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            url: http://loki-gateway.monitoring.svc.cluster.local
            access: proxy
          # Not isDefault: a second default CrashLoopBackOff Grafana (#55).
          # Pick Mimir when building multi-cluster dashboards.
          - name: Mimir
            type: prometheus
            url: http://mimir.monitoring.svc.cluster.local:8080/prometheus
            access: proxy
            jsonData:
              httpMethod: POST
              prometheusType: Mimir
              timeInterval: 30s
  prometheus:
    prometheusSpec:
      externalLabels:
        cluster: platform-do-atl1
