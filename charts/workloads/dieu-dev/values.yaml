# The portfolio site: a static web frontend and a small Go metrics API, served
# together under one hostname (web at /, api at /api). TLS is terminated by the
# Cilium gateway. *.dieu.dev does not cover the zone apex; prod must set
# gateway.tls.apex on cilium-gateway. Stage uses *.staging.dieu.dev.

httproute:
  # Chart default is prod apex. Stage override: preview.staging.dieu.dev.
  hostname: dieu.dev

web:
  image:
    repository: ghcr.io/jonathandieu/dieu-dev-web
    tag: latest # pinned by CI/Kargo once images are pushed to GHCR
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

api:
  image:
    repository: ghcr.io/jonathandieu/dieu-dev-api
    tag: latest # pinned by CI/Kargo once images are pushed to GHCR
  replicas: 1
  port: 8080
  # "mock" serves offline fixtures; "prometheus" reads real cluster data.
  metricsSource: mock
  prometheusUrl: ""
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

ghcrPull:
  username: jonathandieu
  onePasswordItem: github.ghcr-pull

imagePullSecrets:
  - name: dieu-dev-ghcr-pull

