# The portfolio site: a static web frontend and a small Go metrics API, served
# together under one hostname (web at /, api at /api). TLS is terminated by the
# Cilium gateway's *.dieu.dev wildcard, so no cert is needed here.

httproute:
  # Per-cluster: stage serves preview.dieu.dev; a prod override would set dieu.dev.
  hostname: preview.dieu.dev

web:
  image:
    repository: ghcr.io/jonathandieu/dieu-dev-web
    tag: latest # pinned by CI/Kargo once images are pushed to GHCR
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

api:
  image:
    repository: ghcr.io/jonathandieu/dieu-dev-api
    tag: latest # pinned by CI/Kargo once images are pushed to GHCR
  replicas: 1
  port: 8080
  # "mock" serves offline fixtures; "prometheus" reads real cluster data.
  metricsSource: mock
  prometheusUrl: ""
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# Private GHCR packages (dieu.dev is a private repo). Login item must live
# in the "1Password" vault — the onepassword ClusterSecretStore is scoped
# to that vault, not "Private". Fields: username (GitHub user) and password
# (PAT with read:packages). Path-safe title (`<system>.<purpose>`), not the
# item UUID. Don't rename the item in 1Password without updating this.
ghcrPull:
  onePasswordItem: dieu-dev.ghcr-pull

imagePullSecrets:
  - name: dieu-dev-ghcr-pull

