apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dieu-dev-ghcr-pull
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Materialize the dockerconfigjson Secret before pods start pulling.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dieu-dev-ghcr-pull
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # ESO template field. Helm must emit literal double-curly-braces;
        # the inner expressions are evaluated by ESO at reconcile time
        # against the fetched Login fields below. Same trick as
        # cluster-registrations' config template.
        .dockerconfigjson: '{{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}"}}}` }}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.ghcrPull.onePasswordItem }}/username
    - secretKey: password
      remoteRef:
        key: {{ .Values.ghcrPull.onePasswordItem }}/password
