apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dieu-dev-ghcr-pull
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Materialize the dockerconfigjson Secret before pods start pulling.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dieu-dev-ghcr-pull
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ `{"auths":{"ghcr.io":{"username":"` }}{{ .Values.ghcrPull.username }}{{ `","password":"{{ .credential }}"}}}` }}'
  data:
    - secretKey: credential
      remoteRef:
        key: {{ .Values.ghcrPull.onePasswordItem }}/credential
