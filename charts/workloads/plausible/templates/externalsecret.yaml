apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-credentials
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: {{ .Release.Name }}-credentials
    creationPolicy: Owner
  # key format is "<item-id>/<field-label>", same as our other ExternalSecrets.
  # Item: "Plausible" in the 1Password vault.
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: klsv3awch7fg5kznodhkjhnu6e/DATABASE_URL
    - secretKey: CLICKHOUSE_DATABASE_URL
      remoteRef:
        key: klsv3awch7fg5kznodhkjhnu6e/CLICKHOUSE_DATABASE_URL
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: klsv3awch7fg5kznodhkjhnu6e/SECRET_KEY_BASE
    - secretKey: TOTP_VAULT_KEY
      remoteRef:
        key: klsv3awch7fg5kznodhkjhnu6e/TOTP_VAULT_KEY
