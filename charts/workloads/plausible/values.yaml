plausible-analytics:  # imio/plausible-analytics
  image:
    # Explicit repository + tag (rather than relying on the subchart's own
    # defaults) so Renovate's built-in helm-values manager can track this
    # like every other chart's image block. The tag used to be an empty
    # string with a "managed by Kargo" comment, but no Kargo Warehouse/Stage
    # exists for this app -- the empty value fell back to the subchart's
    # appVersion (3.0.1), and upstream's real tags are v-prefixed (v3.0.1),
    # so it silently resolved to a tag that doesn't exist on ghcr.io.
    repository: ghcr.io/plausible/community-edition
    tag: "v3.0.1"

  ingress:
    enabled: false  # routing via Cilium Gateway HTTPRoute

  baseURL: "https://analytics.dieu.dev"
  disableRegistration: true

  # Creds come from templates/externalsecret.yaml (1Password) now, not
  # hardcoded/generated here.
  secret:
    create: false
    existingSecret: "plausible-credentials"  # release name is "plausible"

  # containerd leaves nofile effectively unlimited (~2^30). BEAM sizes its
  # port table from OPEN_MAX when ERL_MAX_PORTS is unset, so idle Plausible
  # sits at ~2.4Gi RSS with no traffic. 1024 is enough for a personal
  # analytics box; this is sockets/fds, not HTTP listen ports.
  extraEnv:
    - name: ERL_MAX_PORTS
      value: "1024"

  # After the port-table clamp, CE idles around 350-500Mi. Bound it so a
  # future env-var regression can't eat the whole stage node again.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi

  clickhouse:
    # Bitnami's default resourcesPreset "small" caps ClickHouse at a 768Mi limit.
    # ClickHouse sets its memory tracker to 90% of the cgroup limit (~691Mi),
    # too little to run background merges and system-log flushes, so it
    # OOM-crashloops (Code 241 MEMORY_LIMIT_EXCEEDED).
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
