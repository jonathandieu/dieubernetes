apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # ESO must materialize this before Authentik/Postgres start (they read it).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.targetName }}
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecret.onePasswordItem }}/secret_key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.onePasswordItem }}/postgresql_password
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.onePasswordItem }}/bootstrap_password
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.onePasswordItem }}/bootstrap_token
