kube-prometheus-stack:
  grafana:
    enabled: false  # using Grafana Cloud

  prometheus:
    prometheusSpec:
      remoteWrite:
        - url: https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push
          basicAuth:
            username:
              name: grafana-cloud-credentials
              key: username
            password:
              name: grafana-cloud-credentials
              key: password

  alertmanager:
    enabled: true
    alertmanagerSpec:
      secrets:
        - alertmanager-slack-webhook
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - 'severity = critical'
          target_matchers:
            - 'severity =~ warning|info'
          equal:
            - 'namespace'
            - 'alertname'
        - source_matchers:
            - 'severity = warning'
          target_matchers:
            - 'severity = info'
          equal:
            - 'namespace'
            - 'alertname'
        - source_matchers:
            - 'alertname = InfoInhibitor'
          target_matchers:
            - 'severity = info'
          equal:
            - 'namespace'
        - target_matchers:
            - 'alertname = InfoInhibitor'
      route:
        group_by: ['namespace', 'alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'slack'
        routes:
          - receiver: 'null'
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: 'null'
        - name: 'slack'
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
              channel: '#alerts'
              send_resolved: true
      templates:
        - '/etc/alertmanager/config/*.tmpl'

# 1Password item for the Slack Incoming Webhook URL (Alertmanager posts to #alerts).
# This is a webhook, not an OAuth bot token, no app/scopes involved.
alertmanagerSlackWebhook:
  onePasswordItem: REPLACE-WITH-ALERTMANAGER-SLACK-WEBHOOK-ITEM-UUID
