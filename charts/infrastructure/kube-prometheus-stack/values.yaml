kube-prometheus-stack:
  grafana:
    enabled: false  # using Grafana Cloud

  prometheus:
    prometheusSpec:
      remoteWrite:
        - url: https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push
          basicAuth:
            username:
              name: grafana-cloud-credentials
              key: username
            password:
              name: grafana-cloud-credentials
              key: password

  alertmanager:
    enabled: true
    alertmanagerSpec:
      secrets:
        - alertmanager-slack-webhook
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - 'severity = critical'
          target_matchers:
            - 'severity =~ warning|info'
          equal:
            - 'namespace'
            - 'alertname'
        - source_matchers:
            - 'severity = warning'
          target_matchers:
            - 'severity = info'
          equal:
            - 'namespace'
            - 'alertname'
        - source_matchers:
            - 'alertname = InfoInhibitor'
          target_matchers:
            - 'severity = info'
          equal:
            - 'namespace'
        - target_matchers:
            - 'alertname = InfoInhibitor'
      route:
        group_by: ['namespace', 'alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'slack'
        routes:
          - receiver: 'null'
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: 'null'
        - name: 'slack'
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
              channel: '#alerts'
              send_resolved: true
      templates:
        - '/etc/alertmanager/config/*.tmpl'

alertmanagerSlackWebhook:
  onePasswordItem: alertmanager.slack-webhook

grafanaCloud:
  onePasswordItem: grafana.prometheus

# In-cluster Grafana admin login. Off by default (Grafana is platform-only).
# Pin the password in 1Password so Argo Helm lookup cannot mint a new one
# on every sync. Username is not a secret.
grafanaAdmin:
  enabled: false
  onePasswordItem: grafana.admin
  username: admin

# Public hostname for in-cluster Grafana. Off by default: this chart runs on
# every cluster, and grafana.dieu.dev must stay unique on the platform gateway
# (do not collide with preview/recipes/analytics/changes/otlp).
grafanaHttpRoute:
  enabled: false
  hostname: grafana.dieu.dev

