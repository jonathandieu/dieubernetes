{{- if .Values.grafanaAdmin.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Grafana mounts this as GF_SECURITY_ADMIN_PASSWORD; it must exist first.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    template:
      engineVersion: v2
      data:
        admin-user: {{ .Values.grafanaAdmin.username | quote }}
        admin-password: '{{ `{{ .credential }}` }}'
  data:
    - secretKey: credential
      remoteRef:
        key: {{ .Values.grafanaAdmin.onePasswordItem }}/credential
{{- end }}
