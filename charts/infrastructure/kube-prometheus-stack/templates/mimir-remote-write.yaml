{{- if .Values.mimirRemoteWrite.auth }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-remote-write
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: mimir-remote-write
    template:
      engineVersion: v2
      data:
        username: {{ .Values.mimirRemoteWrite.username | quote }}
        password: '{{ `{{ .credential }}` }}'
  data:
    - secretKey: credential
      remoteRef:
        key: {{ .Values.mimirRemoteWrite.onePasswordItem }}/credential
{{- end }}
