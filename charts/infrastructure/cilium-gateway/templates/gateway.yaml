{{- if .Values.gateway.create }}
{{- $infra := dict }}
{{- range $k, $v := .Values.gateway.lbAnnotations }}
{{- $_ := set $infra $k $v }}
{{- end }}
{{- if .Values.gateway.originLock.allowCloudflareIPs }}
{{- $_ := set $infra "service.beta.kubernetes.io/do-loadbalancer-allow-rules" (include "cilium-gateway.cloudflareAllowRules" .) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.gateway.originLock.originCA.enabled }}
    cert-manager.io/issuer: {{ .Values.gateway.originLock.originCA.issuerName }}
    cert-manager.io/issuer-kind: ClusterOriginIssuer
    cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
    cert-manager.io/duration: {{ .Values.gateway.originLock.originCA.duration | quote }}
    cert-manager.io/renew-before: {{ .Values.gateway.originLock.originCA.renewBefore | quote }}
    cert-manager.io/private-key-algorithm: ECDSA
    {{- else }}
    cert-manager.io/cluster-issuer: {{ .Values.gateway.tls.clusterIssuer }}
    {{- end }}
spec:
  gatewayClassName: cilium
  {{- if $infra }}
  infrastructure:
    annotations:
      {{- range $k, $v := $infra }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.tls.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    {{- range .Values.gateway.extraTlsListeners }}
    - name: {{ .name }}
      protocol: HTTPS
      port: 443
      hostname: {{ .hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .secretName }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- end }}
