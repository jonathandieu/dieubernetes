apiVersion: v2
name: otel-collector
description: OpenTelemetry Collector — DaemonSet logs to Loki, Deployment metrics to Mimir
version: 0.1.0
dependencies:
  - name: opentelemetry-collector
    version: "0.162.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: opentelemetry-collector
    alias: metricsCollector
    version: "0.162.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: metricsCollector.enabled
