loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false # single tenant
    commonConfig:
      replication_factor: 1
    # Loki 3.x requires an explicit schema; tsdb + v13 is current.
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: dieubernetes-loki
        ruler: dieubernetes-loki
        admin: dieubernetes-loki
      s3:
        # DO Spaces (S3-compatible). Bucket + region come from the Spaces
        # provisioning (terraform); override per cluster if needed.
        endpoint: https://nyc3.digitaloceanspaces.com
        region: nyc3
        s3ForcePathStyle: false
        # accessKeyId/secretAccessKey left null: the S3 client reads
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the injected secret below.

    # No retention config by default means keep everything forever. Cap it so the
    # Spaces bucket doesn't grow unbounded -- 14d is plenty for a homelab-scale
    # log volume and keeps storage cost near zero.
    limits_config:
      retention_period: 336h
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3

  # Single-binary Loki; the scalable components stay at zero.
  singleBinary:
    replicas: 1
    extraEnvFrom:
      - secretRef:
          name: loki-spaces-credentials
    # Chart default is `resources: {}` (unbounded); explicit limits here since this
    # runs on a small, memory-constrained node alongside everything else.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0

  # loki-gateway (nginx) fronts Loki; the otel-collector pushes to its /otlp path.
  gateway:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # Trim the footprint for a small cluster.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

# Top-level (consumed by this chart's own ExternalSecret template, not the subchart).
externalSecret:
  targetName: loki-spaces-credentials
  # 1Password item holding the DO Spaces access key for the dieubernetes-loki bucket
  # (fields: access_key_id, secret_access_key). Scoped to bucket=dieubernetes-loki,
  # permission=readwrite only -- not the account-wide key terraform uses.
  onePasswordItem: 2o4eqyt7vxx5b2hgcvosjf4hia
