{{- if .Values.otlpIngest.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: cilium-gateway-system
  hostnames:
    - {{ .Values.otlpIngest.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /otlp/v1/metrics
      backendRefs:
        - group: ""
          kind: Service
          name: mimir-otlp-ingest
          port: 80
          weight: 1
{{- end }}
