{{- if .Values.remoteWriteIngest.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: cilium-gateway-system
  hostnames:
    - {{ .Values.remoteWriteIngest.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/push
      backendRefs:
        - group: ""
          kind: Service
          name: mimir-remote-write
          port: 80
          weight: 1
{{- end }}
