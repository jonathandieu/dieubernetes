# 3.2.3 is current (2026-10-22). Classic architecture: no Kafka. 3.x
# ingest-storage is off in the ConfigMap so a tag bump cannot silently
# require a broker. Do not float this tag.
image:
  repository: grafana/mimir
  tag: 3.2.3

# WAL + tsdb-sync live here; blocks ship to Spaces. Omit storageClassName:
# cluster default (DOKS do-block-storage).
persistence:
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# 14d, same cap as Loki. Compactor deletes blocks older than this from Spaces.
retention: 336h

# DO Spaces (S3-compatible). Bucket + region come from terraform
# digitalocean_spaces_bucket.mimir; override per cluster if needed.
storage:
  bucket: dieubernetes-mimir
  endpoint: nyc3.digitaloceanspaces.com
  region: nyc3

# Top-level (consumed by this chart's ExternalSecret, not a subchart).
externalSecret:
  targetName: mimir-spaces-credentials
  # Bucket-scoped-by-convention Spaces key (access_key_id, secret_access_key),
  # vault 1Password. Keys are account-wide; this item is for this workload.
  onePasswordItem: digitalocean.mimir-spaces

# Public OTLP metrics door for stage/prod collectors (later plan).
# ClusterIP Mimir stays unauthenticated so Grafana can query.
# Same hostname and 1Password item as Loki logs ingest.
otlpIngest:
  enabled: true
  hostname: otlp.dieu.dev
  onePasswordItem: loki.otlp-auth
  nginxImage: nginx:1.27.5-alpine
